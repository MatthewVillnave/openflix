# Only the verifier creates this randomly named, disposable two-backend project.
services:
  web:
    ports: !override
      - '127.0.0.1::8080'
  jellyfin-a: &jellyfin
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: jellyfin-real-verification
    ports:
      - '127.0.0.1::8096'
    volumes:
      - jf-a-config:/config
      - jf-a-cache:/cache
      - multiple-media-a:/media:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      multiple-media-a:
        condition: service_healthy
  jellyfin-b:
    <<: *jellyfin
    volumes:
      - jf-b-config:/config
      - jf-b-cache:/cache
      - multiple-media-b:/media:ro
    depends_on:
      multiple-media-b:
        condition: service_healthy
  multiple-media-a: &media
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: multiple-media
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').statSync('/media/multiple-ready')"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - multiple-media-a:/media
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  multiple-media-b:
    <<: *media
    volumes:
      - multiple-media-b:/media
  browser:
    profiles: [verification]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser-verification
    command: [node, docker/verify-multiple-browser.mjs]
    environment:
      HOME: /tmp/browser-home
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
volumes:
  jf-a-config:
  jf-a-cache:
  jf-b-config:
  jf-b-cache:
  multiple-media-a:
  multiple-media-b:
