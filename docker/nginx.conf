worker_processes auto;
pid /tmp/nginx.pid;
# Access/error URLs may carry future capabilities. Keep request logging disabled.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_max_body_size 8k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 5s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location ~ ^/api/v1/playback/sessions/[^/]+/stream$ {
      proxy_pass http://server:8787;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 35s;
      gzip off;
    }
    location /api/ {
      proxy_pass http://server:8787;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_read_timeout 20s;
    }
    location = /health { proxy_pass http://server:8787; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
