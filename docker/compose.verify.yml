# Test-only browser; never part of production startup.
services:
  browser:
    profiles: [verification]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: browser-verification
    environment:
      HOME: /tmp/browser-home
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  jellyfin-fixture:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: jellyfin-fixture
    environment:
      OPENFLIX_VERIFY_JELLYFIN_PASSWORD: ${OPENFLIX_VERIFY_JELLYFIN_PASSWORD:?Verification-only credential required}
      OPENFLIX_VERIFY_JELLYFIN_TOKEN: ${OPENFLIX_VERIFY_JELLYFIN_TOKEN:?Verification-only token seed required}
    volumes:
      - jellyfin-fixture-state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true

volumes:
  jellyfin-fixture-state:
