name: Milestone 1 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high
  docker:
    runs-on: ubuntu-latest
    env:
      OPENFLIX_BASE_URL: https://openflix.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker/compose.dev.yml config --quiet
      - run: docker compose up --build --wait
      - name: Verify web, proxy, security headers and readiness
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<title>OpenFlix</title>'
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"healthy"'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi 'Content-Security-Policy'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/me)" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/auth/logout)" = 403
      - name: Verify persistent DB survives restart
        run: |
          docker compose exec -T server node dist/cli.js db:migrate
          docker compose restart server
          docker compose up --wait
          curl --fail --silent http://127.0.0.1:8080/health
      - if: always()
        run: docker compose logs && docker compose down -v
