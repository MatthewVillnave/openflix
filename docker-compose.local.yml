# Local-only candidate. OpenFlix data survives `docker compose down`.
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    environment:
      NODE_ENV: development
      OPENFLIX_BASE_URL: http://127.0.0.1:8080
      OPENFLIX_MASTER_KEY: ${OPENFLIX_MASTER_KEY:?Set a private 32-byte base64 master key}
      OPENFLIX_DATA_DIR: /config
    volumes:
      - openflix-config:/config
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        OPENFLIX_SOURCE_URL: ${OPENFLIX_SOURCE_URL:-}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  openflix-config:
