services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    environment:
      NODE_ENV: production
      OPENFLIX_BASE_URL: ${OPENFLIX_BASE_URL:?Set OPENFLIX_BASE_URL to the public HTTPS origin}
      OPENFLIX_MASTER_KEY: ${OPENFLIX_MASTER_KEY:-}
      OPENFLIX_DATA_DIR: /config
      OPENFLIX_LOG_LEVEL: ${OPENFLIX_LOG_LEVEL:-info}
      OPENFLIX_SESSION_TTL_SECONDS: ${OPENFLIX_SESSION_TTL_SECONDS:-86400}
    volumes:
      - openflix-config:/config
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  openflix-config:
